# ==============================================================================
# GeoGround AI — Render Infrastructure as Code (render.yaml Blueprint)
# One-click deployment for:
#   1. FastAPI ML Microservice
#   2. Express/Node Backend Gateway
#   3. React + Leaflet Frontend (Static Site)
# ==============================================================================

services:
  # ─── 1. FastAPI ML Microservice ─────────────────────────────────────────────
  - type: web
    name: geoground-ml-service
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r ml/requirements.txt -r ml_service/requirements.txt"
    startCommand: "uvicorn ml_service.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ─── 2. Backend Gateway & Reverse Geocoding ─────────────────────────────────
  - type: web
    name: geoground-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "npm install && npm run build"
    startCommand: "node dist/server.js"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 3001
      - key: ML_SERVICE_URL
        value: "https://geoground-ml-service.onrender.com"

  # ─── 3. React Frontend Dashboard ────────────────────────────────────────────
  - type: web
    name: geoground-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: "https://geoground-backend.onrender.com/api/v1"
      - key: VITE_ML_DIRECT_BASE
        value: "https://geoground-ml-service.onrender.com"
