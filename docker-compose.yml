version: '3.8'

services:
  # ─── 1. PostgreSQL Database with PostGIS / Spatial Indexing ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: geoground_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geoground_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoground_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. FastAPI ML Inference Service ──────────────────────────────────────
  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: geoground_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_PORT=8000
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./ml/data/processed:/app/ml/data/processed:ro
      - ./ml/data/external/cache:/app/ml/data/external/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── 3. NestJS Backend API Gateway ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoground_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/geoground_ai
      - ML_SERVICE_URL=http://ml_service:8000
      - BACKEND_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_healthy

  # ─── 4. React Vite Frontend Dashboard ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geoground_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
